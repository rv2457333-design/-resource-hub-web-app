<div class="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans selection:bg-indigo-600 selection:text-white">
  
  <!-- Global Navigation Header -->
  <app-navbar></app-navbar>

  <!-- Routed Page View -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Global Modals -->
  <app-reader-modal></app-reader-modal>
  <app-add-book-modal></app-add-book-modal>

  <!-- Toast Notification Stack -->
  <div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none">
    @for (toast of bookService.toasts(); track toast.id) {
      <div 
        class="pointer-events-auto p-4 rounded-2xl shadow-xl border flex items-center justify-between gap-3 animate-in slide-in-from-bottom-3 fade-in duration-200"
        [class.bg-slate-900]="toast.type === 'info'"
        [class.text-white]="toast.type === 'info' || toast.type === 'success' || toast.type === 'error'"
        [class.border-slate-800]="toast.type === 'info'"
        [class.bg-emerald-600]="toast.type === 'success'"
        [class.border-emerald-700]="toast.type === 'success'"
        [class.bg-rose-600]="toast.type === 'error'"
        [class.border-rose-700]="toast.type === 'error'"
        [class.bg-amber-500]="toast.type === 'warning'"
        [class.border-amber-600]="toast.type === 'warning'">
        
        <div class="flex items-center gap-2.5 text-xs font-semibold">
          @if (toast.type === 'success') {
            <mat-icon class="text-base text-white">check_circle</mat-icon>
          } @else if (toast.type === 'error') {
            <mat-icon class="text-base text-white">error</mat-icon>
          } @else {
            <mat-icon class="text-base text-indigo-300">info</mat-icon>
          }
          <span>{{ toast.message }}</span>
        </div>

        <button
          type="button"
          (click)="bookService.dismissToast(toast.id)"
          class="text-white/80 hover:text-white p-1 rounded-lg">
          <mat-icon class="text-xs">close</mat-icon>
        </button>
      </div>
    }
  </div>

  <!-- Global Footer -->
  <app-footer></app-footer>

</div>
